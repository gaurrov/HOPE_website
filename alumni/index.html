<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Alumni | HOPE</title>
    <meta name="description" content="HOPE alumni and where they work now." />
    <meta name="theme-color" content="#FFFFFF" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400..800;1,400..700&display=swap"
    />
    <script>
      (function () {
        var stored = null;
        try { stored = localStorage.getItem('hope-lite'); } catch (e) {}
        var lite = stored === null ? window.matchMedia('(prefers-reduced-motion: reduce)').matches : stored === '1';
        document.documentElement.classList.add(lite ? 'lite' : 'full');
      })();
    </script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>

    <header class="site-head">
      <a class="site-head__logo wordmark is-visible" data-always="1" href="/" aria-label="HOPE home">
        <span class="t-h">H</span><span class="t-o">O</span><span class="t-p">P</span><span class="t-e">E</span>
      </a>
      <div class="site-head__right">
        <button class="icon-btn menu-btn" type="button" aria-expanded="false" aria-controls="menu" aria-label="Open menu">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 8h16M4 16h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>

    <nav class="menu" id="menu" aria-label="Main" hidden>
      <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/#events">Events</a></li>
        <li><a href="/batches/">Batches</a></li>
        <li><a href="/alumni/" aria-current="page">Alumni</a></li>
        <li><a href="/#mentors">Mentors</a></li>
      </ul>
    </nav>

    <div class="page__glyphs" aria-hidden="true">
      <span class="glyph glyph--3d t-p" style="right:9%;top:18%;--d:1"><span class="glyph__bob" style="--bob:6s">&lt;/&gt;</span></span>
      <span class="glyph glyph--3d t-o" style="right:26%;top:40%;--d:1"><span class="glyph__bob" style="--bob:5s">#</span></span>
    </div>

    <main id="main" class="page">
      <h1 class="page__title split-chars">Alumni</h1>
      <p class="page__lead">People who came through HOPE and where they work now. Search by name, skill or company, and open anyone to see their projects.</p>

      <div class="chips" role="group" aria-label="Filter by batch"></div>

      <section class="alumni-browser" aria-label="Alumni"></section>
    </main>

    <footer class="inner-foot">
      <nav aria-label="Footer">
        <a href="/">Home</a><a href="/batches/">Batches</a><a href="/alumni/">Alumni</a>
      </nav>
      <button class="term-open" type="button" aria-label="Open the HOPE terminal"><span aria-hidden="true">&gt;_</span> Terminal <kbd>`</kbd></button>
      <p>HOPE, House of Programming Expertise</p>
    </footer>

    <script type="module" src="/src/pages/alumni.js"></script>
  </body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Placeholder lab interior. Replace by setting the 'venue' slot in src/photos.js -->
  <defs>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a88d6e"/><stop offset="1" stop-color="#7b6248"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e4e9f2"/><stop offset="1" stop-color="#cfd7e4"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bfe3f5"/><stop offset="1" stop-color="#8fc4e0"/>
    </linearGradient>
  </defs>

  <!-- room -->
  <polygon points="0,0 1600,0 1230,190 370,190" fill="#f1f3f8"/>
  <polygon points="0,1000 1600,1000 1230,560 370,560" fill="url(#floor)"/>
  <polygon points="0,0 370,190 370,560 0,1000" fill="#d6dde9"/>
  <polygon points="1600,0 1230,190 1230,560 1600,1000" fill="#d6dde9"/>
  <rect x="370" y="190" width="860" height="370" fill="url(#wall)"/>

  <!-- ceiling lights -->
  <g fill="#ffffff" stroke="#b9c3d4" stroke-width="3">
    <polygon points="560,60 760,60 770,95 545,95"/>
    <polygon points="840,60 1040,60 1055,95 830,95"/>
    <polygon points="600,130 760,130 765,152 592,152"/>
    <polygon points="840,130 1000,130 1008,152 835,152"/>
  </g>

  <!-- windows on the left wall -->
  <g fill="url(#win)" stroke="#9aa6b8" stroke-width="5">
    <polygon points="40,150 250,225 250,470 40,500"/>
    <polygon points="275,235 345,262 345,460 275,467"/>
  </g>
  <g stroke="#9aa6b8" stroke-width="4">
    <line x1="145" y1="188" x2="145" y2="485"/>
    <line x1="40" y1="330" x2="250" y2="350"/>
  </g>
  <!-- door on the right wall -->
  <polygon points="1300,230 1420,170 1420,700 1300,620" fill="#9c7c5c" stroke="#6d5440" stroke-width="5"/>
  <circle cx="1320" cy="440" r="7" fill="#e6c27a"/>

  <!-- whiteboard -->

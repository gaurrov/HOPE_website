  <g stroke="#4a6fa8" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M465 290 h110 M465 320 h70 M500 350 h120 M500 380 h80"/>
    <path d="M640 280 l40 35 l-40 35"/>
  </g>
  <rect x="470" y="425" width="250" height="10" fill="#8d97a8"/>

